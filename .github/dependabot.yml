version: 2
updates:
  # Covers backend/, pipeline/, and ingest/ via the shared workspace uv.lock
  # (pyproject.toml's [tool.uv.workspace] at repo root).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
