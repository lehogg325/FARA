[project]
name = "fara-normalize"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "click>=8.1",
    "fara-ingest",
]

[project.scripts]
fara-normalize = "fara_normalize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fara_normalize"]

[tool.uv.sources]
fara-ingest = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
]
