[project]
name = "fara-extract"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "click>=8.1",
    "pdfplumber>=0.11",
    "pdf2image>=1.17",
    "pytesseract>=0.3.13",
    "anthropic>=0.40",
    "pydantic>=2",
    "fara-ingest",
    "fara-normalize",
]

[project.scripts]
fara-extract = "fara_extract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fara_extract"]

[tool.uv.sources]
fara-ingest = { workspace = true }
fara-normalize = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
]
