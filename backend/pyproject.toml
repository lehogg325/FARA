[project]
name = "fara-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fara_backend"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fara-normalize",
]

[tool.uv.sources]
fara-normalize = { workspace = true }
