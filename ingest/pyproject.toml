[project]
name = "fara-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "boto3>=1.35",
]

[project.scripts]
fara-ingest = "fara_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fara_ingest"]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "moto[server]>=5.0",
]
